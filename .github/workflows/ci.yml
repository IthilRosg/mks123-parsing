name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    env:
      PYTHONPATH: .
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python scripts/check_repository_boundary.py
      - run: uv run python -m pytest -q
      - run: uv run ruff check .
      - run: uv run python -m compileall -q mks123_pipeline scripts run_all.py run_pilot.py verify_run.py verify_pilot.py
