[project]
name = "mks123-supplier-pipeline"
version = "0.1.0"
description = "Read-only supplier ingestion and proposal pipeline for mks123"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "defusedxml>=0.7.1,<1",
    "duckdb==1.5.5",
    "fsspec>=2025.7.0,<2027",
    "pandas==2.3.3",
    "pillow==12.3.0",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
]

[project.scripts]
netlab-media = "mks123_pipeline.netlab_media_cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mks123_pipeline"]
py-modules = ["run_all", "run_pilot", "verify_run", "verify_pilot"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
